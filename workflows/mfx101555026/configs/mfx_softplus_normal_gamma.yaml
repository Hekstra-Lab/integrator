# ADAPTED FOR MFX:
# Uses monochromatic mode because Kevin suggested avoiding the polychromatic Wilson prior here.
mode: monochromatic


# Main integrator model settings.
integrator:
  name: hierarchical

  args:
    encoder_out: 32
    mc_samples: 20
    data_dim: 2d
    d: 1
    h: 25
    w: 25

    predict_keys:
      - refl_ids
      - is_test

      - qi_mean
      - qi_var

      - qp_mean

      - qbg_mean
      - qbg_var

      - intensity.sum.value
      - intensity.sum.variance

      - d
      - H
      - K
      - L


# Optimizer settings.
optimizer:
  lr: 0.001
  weight_decay: 0.0


# Data loader settings.
data_loader:
  name: rotation_data

  args:
    data_dir: /sdf/scratch/lcls/ds/prj/prjlumine22/scratch/thaoh/mfx101555026_cctbx/mfx_shoebox_r0269_018_rg070_fastreader_merged_all

    batch_size: 1024
    validation_split: 0.2
    num_workers: 4

    # For MFX/Jungfrau float pixels that can be negative.
    transform: log_softplus

    resolution_cutoff: null

    shoebox_file_names:
      data_dir: /sdf/scratch/lcls/ds/prj/prjlumine22/scratch/thaoh/mfx101555026_cctbx/mfx_shoebox_r0269_018_rg070_fastreader_merged_all

      counts: counts.npy
      masks: masks.npy
      reference: metadata_numeric.npy
      standardized_counts: null


# Loss function settings.
loss:
  name: monochromatic_wilson

  args:
    observation_likelihood: normal
    init_obs_scale: 10.0
    n_bins: 1


# PyTorch Lightning trainer settings.
trainer:
  max_epochs: 25
  accelerator: gpu
  devices: 1
  gradient_clip_val: 1.0
  check_val_every_n_epoch: 1


# Checkpoint settings.
checkpoint:
  save_top_k: -1


# Encoder networks.
encoders:
  - name: profile_encoder
    args:
      data_dim: 2d
      encoder_out: 32
      input_shape:
        - 25
        - 25

  - name: intensity_encoder
    args:
      data_dim: 2d
      encoder_out: 32

  - name: intensity_encoder
    args:
      data_dim: 2d
      encoder_out: 32

  - name: intensity_encoder
    args:
      data_dim: 2d
      encoder_out: 32

  - name: intensity_encoder
    args:
      data_dim: 2d
      encoder_out: 32


# Surrogate/posterior distributions.
surrogates:
  # qp = profile posterior.
  qp:
    name: learned_basis_profile
    args:
      latent_dim: 12
      init_std: 0.5
      prior_scale: 3.0
      input_dim: 32
      output_dim: 625

  # qbg = background posterior.
  qbg:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32

  # qi = intensity posterior.
  qi:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32