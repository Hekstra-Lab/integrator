# Registry of where each shoebox dataset came from, the hand-entered input to scripts/datasets_db.py.
# Only facts that no file on disk records go here; everything else (sim parameters and commits from
# manifest*.json, reflection counts, box, dtype, statistics, cell from dataset.yaml and counts.npy, the
# configs that use a dataset) is read by `datasets_db.py build`, which upserts all of it into the SQLite
# database. Edit this file, commit, pull on the cluster, rebuild; never edit the database by hand.
#
# Chain: sim_runs -> noise_runs -> integration_runs -> datasets (each link optional for real data).

sim_runs:
  - name: paper_full/mos010
    dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010
    manifest: manifest.json            # datsimx command, parameters, commits

noise_runs:
  - name: mos010_noisy_pc
    sim_run: paper_full/mos010
    dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/noisy_pc
    manifest: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/manifest_noisy_pc.json
    detector: photon-counting (Eiger geometry, no PSF)

integration_runs:
  - name: mos010_pc_laue_default
    noise_run: mos010_noisy_pc
    dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/laue_dials_pc
    software: laue-dials
    version: upstream main d57f96e (software/laue-dials-main, branch datsimx-sim)
    prediction: default
    mtz: integrated.mtz
  - name: mos010_pc_laue_permissive
    noise_run: mos010_noisy_pc
    dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/laue_dials_pc
    software: laue-dials
    version: upstream main d57f96e (software/laue-dials-main, branch datsimx-sim)
    prediction: permissive (cutoff_log_probability -20)
    mtz: integrated_all.mtz

datasets:
  - name: mos010_pc_default_25
    path: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/shoeboxes/pc_default_25
    kind: simulated
    integration_run: mos010_pc_laue_default
    images: datsimx mos010 + nanoBragg-noise photon-counting (gain 1, readout 0, calib 0)
    cut_by: scripts/physics/make_sim_shoeboxes.py cut --datsimx-* --size 25, then finalize with its default nearest-centroid overlap mask (2.4% of pixels masked, 17% of boxes touched)
  - name: mos010_pc_all_25
    path: /n/netscratch/hekstra_lab/Lab/laldama/sims/paper_full/mos010/shoeboxes/pc_all_25
    kind: simulated
    integration_run: mos010_pc_laue_permissive
    images: datsimx mos010 + nanoBragg-noise photon-counting (gain 1, readout 0, calib 0)
    cut_by: scripts/physics/make_sim_shoeboxes.py cut --datsimx-* --size 25, then finalize with its default nearest-centroid overlap mask (5.4% of pixels masked, 34% of boxes touched)
  - name: simdhfr_41
    path: /n/netscratch/hekstra_lab/Lab/laldama/sim/pytorch_41
    kind: simulated
    images: laue-dials paper sim (Mendez, hkl_data reference condition; Rayonix geometry, gain 0.7, readout 3, PSF), int32 CBF
    cut_by: laue-dials reflections
  - name: simdhfr_full180
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/dhfr_sim/nanobragg_prior/full180
    kind: simulated
    images: laue-dials paper sim, as simdhfr_41
    cut_by: scripts/physics/make_sim_shoeboxes.py at the true orientation
  - name: hewl_1118
    path: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_1118/pytorch_data
    kind: real
    images: HEWL Laue, BioCARS, 1118
    cut_by: laue-dials reflections
  - name: hewl_1118_360
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/1118_hewl360/shoeboxes
    kind: real
    images: HEWL Laue, BioCARS, 1118, 360-image subset
    cut_by: laue-dials reflections
  - name: hewl_1118_3
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/1118_hewl3/shoeboxes
    kind: real
    images: HEWL Laue, BioCARS, 1118
    cut_by: laue-dials reflections
  - name: dhfr_1117
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/1117_ldint/shoeboxes
    kind: real
    images: DHFR Laue, BioCARS, 1117
    cut_by: laue-dials reflections
  - name: pdz2_1116_pooled
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/pdz2_model/pooled
    kind: real
    images: PDZ2 E-field TR-Laue, 1116, sweeps pooled
    cut_by: laue-dials reflections (deposited pipeline)
  - name: pdz2_1116_pooled35
    path: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/pdz2_model/pooled35
    kind: real
    images: PDZ2 E-field TR-Laue, 1116, sweeps pooled
    cut_by: laue-dials reflections (deposited pipeline)
  - name: hewl_9b7c
    path: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    kind: real
    images: HEWL monochromatic rotation, 9b7c
    cut_by: DIALS reflections
  - name: hewl_9b7c_scaling
    path: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/scaling_dataset
    kind: real
    images: HEWL monochromatic rotation, 9b7c
    cut_by: DIALS reflections
  - name: sbgrid_821
    path: /n/netscratch/hekstra_lab/Lab/laldama/sbgrid/821/integrator/dataset
    kind: real
    images: SBGrid 821, monochromatic
    cut_by: DIALS reflections
