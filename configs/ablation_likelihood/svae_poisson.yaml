mode: monochromatic # rotation-method monochromatic crystallography

# Ablation control arm: Poisson pixel likelihood on the SVAE (conjugate-style)
# integrator. This is the exact-conjugate SVAE. Identical to svae_nbinom.yaml
# except loss.args.likelihood.

integrator:
  name: svae
  args:
    encoder_out: 64 # hidden representation width
    mc_samples: 100 # monte carlo samples for the reconstruction ELBO

encoders:
  - name: profile_encoder
    args:
      data_dim: 3d
      in_channels: 1
      input_shape: [3, 21, 21]
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [1, 3, 3]
      conv1_padding: [0, 1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [1, 2, 2]
      pool_stride: [1, 2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3, 3]
      conv2_padding: [0, 0, 0]
      norm2_num_groups: 4
      dropout: 0.0
  - &signal_encoder
    name: intensity_encoder
    args:
      data_dim: 3d
      in_channels: 1
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [3, 3, 3]
      conv1_padding: [1, 1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [1, 2, 2]
      pool_stride: [1, 2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3, 3]
      conv2_padding: [0, 0, 0]
      norm2_num_groups: 4
      conv3_out_channels: 256
      conv3_kernel_size: [3, 3, 3]
      conv3_padding: [1, 1, 1]
      norm3_num_groups: 8

surrogates:
  qp:
    name: learned_basis_profile
    args:
      input_dim: 64
      latent_dim: 12
      output_dim: 1323
      init_std: 0.5
      prior_scale: 3.0
      smoothness_weight: 0.02

loss:
  name: monochromatic_wilson
  args:
    lp_correction: true         # multiply tau by metadata['lp']; mono-only
    init_B: 30.0                # init Wilson B (A^2): B = softplus(raw_B) + b_min
    b_min: 1.0
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: 1.0
    bg_concentration: 1.0
    n_bins: 25
    # --- scale stabilization: prevents G/B collapse to the floor; DIALS-free ---
    stabilize_scale: true       # log-space G + a one-time scale init fit from raw counts
    # init_G: 200.0             # pin the initial scale here instead (skips the count fit)
    # --- likelihood ablation knob (only difference vs svae_nbinom.yaml) ---
    likelihood: poisson             # poisson | negative_binomial

optimizer:
  lr: 0.001 # Adam learning rate
  decoder_weight_decay: 1.0e-3 # weight decay on the qp decoder basis only

data_loader:
  args:
    data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/scaling_dataset
    batch_size: 2048
    validation_split: 0.2
    num_workers: 8
    include_test: true
    subset_size: null           # cap on reflections loaded (debugging)
    resolution_cutoff: null                # resolution cutoff, or null
    min_valid_pixels: 10        # drop shoeboxes with fewer valid pixels
    transform: anscombe         # anscombe | log1p | standardization (derived from dataset.yaml if omitted)

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  enable_checkpointing: true
  deterministic: false
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: -1                # -1 keeps every (written) ckpt; N keeps best N by monitor
  monitor: val elbo
  mode: min
