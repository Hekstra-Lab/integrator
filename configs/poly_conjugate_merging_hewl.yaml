integrator:
  name: conjugate_merging
  args:
    data_dim: 2d
    d: &d 1
    h: &h 25
    w: &w 25
    lr: 0.001
    encoder_out: &encoder_out 32
    weight_decay: 0.0
    decoder_weight_decay: 0.0
    qp_smoothness_weight: 0.02
    qp_orthogonality_weight: 0.0
    scaling_lr: 0.001          # decoupled LR for the slow scale field
    mc_samples: &mc_samples 100

    # Transplant + FREEZE the background (k_bg/r_bg encoders + qbg) from the good
    # polychromatic integration run (gitsha 8969d6a). That run modeled the Laue
    # background correctly, so freezing it takes the bg out of the optimization
    # and the merge can only fit the peak. The bg encoders below MUST match that
    # run's architecture (intensity_encoder 16/32/64, encoder_out 32; qbg gammaB
    # k_min 0.1 exp). Set to null to learn the bg instead.
    bg_init_from_checkpoint: /n/netscratch/hekstra_lab/Lab/laldama/lightning_logs/wandb/run-20260512_121357-ef3hb6yc/files/checkpoints/epoch=0099.ckpt
    bg_freeze: true

    # Conjugate merge: I_h derived from sufficient statistics (no I encoder).
    n_hkl: 22949
    wilson_alpha: 1.0
    sample_I_h: true
    merge_kl_weight: 1.0       # ELBO-consistent (sum/n_obs); lower for weaker Wilson reg
    consistency_weight: 0.5    # data-only per-obs scale gradient (DIALS-style)
    # Inner CAVI fixed point: high Laue multiplicity (~84 obs/HKL) raises the
    # merge Jacobian, so allow more responsibility iterations (per-HKL early-stop).
    n_em_iters: 100
    em_tol: 1.0e-3
    exact_posterior_n_grid: 1024

    # --- STRUCTURED spectral scale (same as the amortized poly model) ---
    scale_laue_spectral: true
    scale_lambda_min: 0.97
    scale_lambda_max: 1.25
    scale_spectrum_degree: 40
    # Warm-start G(lambda) from the working polychromatic_wilson run (de-risking):
    #   uv run python scripts/extract_spectrum.py <poly_5enc_ckpt> --save spectrum_init.pt
    scale_spectrum_init_from: null
    scale_freeze_spectrum: false
    scale_lorentz: true
    scale_polarization: false
    scale_beam_center: [1993.8, 1973.7]
    scale_r_max: 1600.0
    scale_residual: false
    scale_mlp_hidden: 64       # reused only if scale_residual: true
    scale_mlp_layers: 2

    log_intensity_scatter: true   # per-epoch model scale*I_h vs DIALS, + log-CC
    log_background_scatter: true   # per-epoch model bg vs DIALS background.sum.value

# THREE encoders only (2D): profile + (k_bg, r_bg). No intensity encoder -- I_h is
# derived from the conjugate responsibility split, not predicted.
encoders:
- name: profile_encoder
  args:
    data_dim: 2d
    input_shape: [*h, *w]
    encoder_out: *encoder_out
    conv1_out_channels: 8
    conv2_out_channels: 16
    dropout: 0.2
- &bg_enc
  name: intensity_encoder
  args:
    # MUST match the source run's bg encoders (16/32/64) for the frozen-bg
    # transplant (bg_init_from_checkpoint) to load.
    data_dim: 2d
    encoder_out: *encoder_out
    conv1_out_channels: 16
    conv2_out_channels: 32
    conv3_out_channels: 64
- *bg_enc

# TWO surrogates: profile + background. NO qi (I_h is derived).
surrogates:
  qp:
    name: learned_basis_profile
    args:
      # Peaked 2D Hermite basis (auto-generated), so the profile cannot relax to
      # uniform and impersonate the flat Laue background.
      warmstart_basis_path: hermite_profile_basis_poly.pt
      hermite_max_order: 4
      hermite_basis_sigma: 1.5
      input_dim: *encoder_out
      output_dim: 625
      init_std: 0.5
  qbg:
    # Architecture MUST match the source run's qbg for the transplant to load.
    # No mean_init: the weights come from bg_init_from_checkpoint (and are frozen).
    name: gammaB
    args:
      in_features: *encoder_out
      eps: 1.0e-06
      k_min: 0.1
      mu_positive_constraint: exp

loss:
  name: monochromatic_wilson
  args:
    lp_correction: false
    mc_samples: *mc_samples
    eps: 1.0e-06
    n_bins: 30
    profile_prior_scale: 3.0
    # pi_weight=0: the per-obs intensity KL is skipped; the closed-form per-HKL
    # Gamma-Gamma KL is applied directly in the integrator. bg_rate/bg_concentration
    # are auto-injected from the auto-generated bg_prior.pt (empirical Laue bg).
    pi_weight: 0.0
    pbg_weight: 1.0
    pprf_weight: 1.0
    b_min: 1.0

data_loader:
  name: polychromatic_data
  args:
    data_dir: &data_dir /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_1118/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    # Required: the conjugate fixed point needs complete HKL groups per batch.
    group_by_asu_id: true
    group_by_key: asu_id
    max_obs_per_hkl: 150
    ice_ring_ranges: [[1.34, 1.42]]
    shoebox_file_names:
      data_dir: *data_dir
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      reference: metadata.pt
      standardized_counts: null
    D: *d
    H: *h
    W: *w
    anscombe: true

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

logger:
  d: *d
  h: *h
  w: *w

output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_1118/pytorch_data/reflections_.refl
