# Ablation V1b -- parameter-count control for V1.
#   encoders : 2 (profile + a single WIDE shared intensity/background encoder)
#   qi/qbg   : Gamma, shape_rate parameterization ("GammaA")
#   profile  : Dirichlet (KL against uniform Dirichlet(1))
#   prior    : global Gamma intensity + background prior (Gamma MLE on the data)
#
# Same architecture as V1 (2 encoders) but the single intensity encoder is
# widened (conv channels 24/52/176 instead of 16/32/64) so its parameter count
# equals the 4 intensity encoders of the 5-encoder version (V3). Because the
# profile encoder and all surrogate heads are identical across V1/V1b/V3, this
# makes V1b's TOTAL parameter count match V3's to within a handful of params.
# Comparing V1b against V3 isolates the effect of DECOUPLING the encoders from
# the effect of simply having more parameters: if V3 still beats V1b, the win is
# architectural, not a parameter-count artifact.
mode: monochromatic              # rotation-method monochromatic crystallography

integrator:
  name: hierarchical_2enc        # 2 encoders: profile, shared intensity/background
  args:
    encoder_out: 32              # micro embedding width feeding the surrogates (full: 64)
    mc_samples: 100              # Monte Carlo samples per forward pass
    # data_dim: 3d               # 2d | 3d (filled from <data_dir>/dataset.yaml if omitted)
    # d: 3                       # shoebox depth (z-slices); from dataset.yaml if omitted
    # h: 21                      # shoebox height
    # w: 21                      # shoebox width
    predict_keys: default        # 'default' -> mode-minimal columns; or an explicit list
    # additional_predict_keys: [qp_mean]   # appended on top of the 'default' set

encoders:
- name: profile_encoder          # identical to V1 (held fixed for the control)
  args:
    data_dim: 3d
    encoder_out: 32
    conv1_out_channels: 16
    conv2_out_channels: 32
    dropout: 0.0
- &intensity_encoder             # WIDENED: ~4x params of the V1 intensity encoder
  name: intensity_encoder        # (= the 4 intensity encoders of the 5-enc version)
  args:
    data_dim: 3d
    encoder_out: 32
    conv1_out_channels: 24       # V1 uses 16
    conv2_out_channels: 52       # V1 uses 32
    conv3_out_channels: 176      # V1 uses 64 (divisible by norm3_num_groups=8)

optimizer:
  lr: 0.001                      # base Adam learning rate
  weight_decay: 0.0              # Adam weight decay on all params
  decoder_weight_decay: null     # null: no learned-basis qp decoder under Dirichlet
  lr_schedule: null              # null | cosine_warmup | step_linear_warmup
  warmup_epochs: 5               # used by cosine_warmup
  warmup_steps: 0                # used by step_linear_warmup
  lr_min: 1.0e-5                 # schedule floor LR (<= lr)

surrogates:
  qi:                            # intensity posterior q(I)
    name: gamma                  # the only intensity/background surrogate family
    args:
      reparameterization: shape_rate   # shape_rate ("GammaA") | mean_fano | nakagami
      k_min: 0.01                       # floor on the Gamma shape k (rsample stability)
      eps: 1.0e-6                        # numerical floor on the rate
      positive_constraint: softplus     # softplus | exp; or a [k_head, r_head] pair
      # in_features: 32                  # auto-injected from integrator.encoder_out
      # --- nakagami-only (reparameterization: nakagami) ---
      # m_min: 0.1
      # m_init: 1.0
      # mean_init: null                  # init Omega so the mean starts near this value
  qbg:                           # background posterior q(bg)
    name: gamma
    args:
      reparameterization: shape_rate
      k_min: 0.01
      eps: 1.0e-6
      positive_constraint: softplus
  qp:                            # profile posterior q(prf)
    name: dirichlet              # dirichlet | learned_basis_profile
    args:
      positive_constraint: softplus     # softplus | exp (applied to the concentration)
      eps: 1.0e-6
      # in_features: 32                  # auto-injected from integrator.encoder_out
      # sbox_shape: [3, 21, 21]          # auto-injected from geometry (d, h, w)

loss:
  name: global_prior
  args:
    # i_concentration/i_rate and bg_concentration/bg_rate auto-fill from a Gamma
    # MLE (prepare_global_priors). Uncomment to pin fixed values and skip the fit:
    # i_concentration: 0.25
    # i_rate: 2.0e-4
    # bg_concentration: 1.7
    # bg_rate: 1.8
    intensity_kl_weight: 1.0     # weight on KL(q(I) || global Gamma)
    background_kl_weight: 1.0    # weight on KL(q(bg) || global Gamma)
    profile_kl_weight: 1.0       # weight on KL(q(prf) || uniform Dirichlet)

data_loader:
  name: rotation_data
  args:
    data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    batch_size: 2048
    validation_split: 0.2
    num_workers: 8
    include_test: true           # include test-set reflections when loading
    min_valid_pixels: 10         # drop shoeboxes with fewer valid pixels
    subset_size: null            # cap reflections loaded (debugging); null = all
    resolution_cutoff: null      # keeps d < cutoff, i.e. drops LOW
    # resolution; for a high-resolution limit use d_min instead
    transform: anscombe        # anscombe | log1p | standardization (from dataset.yaml)

trainer:
  max_epochs: 50
  accelerator: gpu               # cpu | gpu | auto
  devices: 1
  precision: '32'                # '16' | '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm  # norm | value
  deterministic: false

# Optional; omit a block to disable it.
# early_stop:
#   monitor: val elbo              # any logged metric: {train,val} {elbo,kl,nll}
#   mode: min
#   patience: 10
#   min_delta: 0.0

checkpoint:
  save_top_k: -1                 # -1 keeps every written ckpt; N keeps best N by monitor
  monitor: val elbo
  mode: min

# output:
#   refl_file: /path/to/reflections.refl   # filled from dataset.yaml if omitted
