# JUNGFRAU likelihood comparison -- POISSON arm.
# Poisson likelihood on the rounded integer counts (data/jf_train_int).
#
# 5-encoder hierarchical integrator + global_prior loss on 2D 20x20 shoeboxes.
# global_prior (not Wilson): the sim intensities are a flat Exp(mean) with no
# resolution, so one global Gamma prior is exactly right and needs no metadata['d'].
#
# The three arms (jf_poisson / jf_normal_coupled / jf_normal_free) are identical
# except for `loss.args.likelihood` and `data_loader.args.data_dir`.

mode: monochromatic

integrator:
  name: hierarchical            # 5 encoders: profile, k_i, r_i, k_bg, r_bg
  args:
    encoder_out: 32
    mc_samples: 100
# no `encoders:` -> factory synthesizes 2D encoders from dataset.yaml (data_dim: 2d)

surrogates:
  qi:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qbg:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qp:
    name: dirichlet
    args: {eps: 1.0e-6}

loss:
  name: global_prior
  args:
    likelihood: poisson
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0

optimizer:
  lr: 0.001

data_loader:
  args:
    data_dir: data/jf_train_int      # rounded integer counts
    batch_size: 256
    validation_split: 0.2
    num_workers: 0
    transform: asinh                 # same encoder-input transform as the Normal arms,
    asinh_scale: 1.0                 # so the ONLY cross-arm difference is the likelihood
    min_valid_pixels: 1

trainer:
  max_epochs: 30
  accelerator: auto              # set to gpu on the cluster
  devices: 1
  precision: '32'
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: 1
  monitor: val elbo
  mode: min
