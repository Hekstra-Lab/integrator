# JUNGFRAU likelihood comparison -- NORMAL (FREE) arm.
# Normal likelihood on the real-valued detector output (data/jf_train_real), with a
# single learned variance -- the naive baseline that ignores the mean-variance
# coupling of count data. The standalone study found this is over-confident on bright
# pixels (error bars ~2x too small); this arm tests whether that survives a full
# amortized fit.
#
# Identical to jf_normal_coupled.yaml except the Normal variance is `free`.

mode: monochromatic

integrator:
  name: hierarchical            # 5 encoders: profile, k_i, r_i, k_bg, r_bg
  args:
    encoder_out: 32
    mc_samples: 100
# no `encoders:` -> factory synthesizes 2D encoders from dataset.yaml (data_dim: 2d)

surrogates:
  qi:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qbg:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qp:
    name: dirichlet
    args: {eps: 1.0e-6}

loss:
  name: global_prior
  args:
    likelihood: normal
    normal_variance: free          # one learned sigma for every pixel
    normal_sigma_init: 1.0
    normal_learn_sigma: true
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0

optimizer:
  lr: 0.001

data_loader:
  args:
    data_dir: data/jf_train_real     # real-valued detector output (can be < 0)
    batch_size: 256
    validation_split: 0.2
    num_workers: 0
    transform: asinh                 # defined on negatives; compresses bright peaks
    asinh_scale: 1.0                 # linear->log knee, in photons
    min_valid_pixels: 1

trainer:
  max_epochs: 30
  accelerator: auto              # set to gpu on the cluster
  devices: 1
  precision: '32'
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: 1
  monitor: val elbo
  mode: min
