# JUNGFRAU likelihood comparison -- NORMAL (COUPLED) arm.
# Normal likelihood on the real-valued detector output (data/jf_train_real), with the
# physically-correct variance Var = rate + read_noise^2 (Poisson variance + Gaussian
# read noise). read_noise = 0.024 photons is JUNGFRAU G0. This is the best a Gaussian
# can do -- if Poisson-on-integers matches or beats it, that is the strong result.
#
# Identical to jf_poisson.yaml except `loss.args.likelihood` (+ normal args) and the
# data directory (real-valued counts, which are negative on ~28% of pixels).

mode: monochromatic

integrator:
  name: hierarchical            # 5 encoders: profile, k_i, r_i, k_bg, r_bg
  args:
    encoder_out: 32
    mc_samples: 100
# no `encoders:` -> factory synthesizes 2D encoders from dataset.yaml (data_dim: 2d)

surrogates:
  qi:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qbg:
    name: gamma
    args: {reparameterization: shape_rate, k_min: 0.01, eps: 1.0e-6}
  qp:
    name: dirichlet
    args: {eps: 1.0e-6}

loss:
  name: global_prior
  args:
    likelihood: normal
    normal_variance: coupled       # Var = rate + read_noise^2
    normal_read_noise: 0.024       # JUNGFRAU G0 read noise, in photons
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0

optimizer:
  lr: 0.001

data_loader:
  args:
    data_dir: data/jf_train_real     # real-valued detector output (can be < 0)
    batch_size: 256
    validation_split: 0.2
    num_workers: 0
    transform: asinh                 # defined on negatives; compresses bright peaks
    asinh_scale: 1.0                 # linear->log knee, in photons
    min_valid_pixels: 1

trainer:
  max_epochs: 30
  accelerator: auto              # set to gpu on the cluster
  devices: 1
  precision: '32'
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: 1
  monitor: val elbo
  mode: min
