mode: monochromatic # rotation-method monochromatic crystallography

integrator:
  name: svae_hybrid
  args:
    encoder_out: 64 # hidden representation width
    mc_samples: 100 # monte carlo samples for the reconstruction ELBO

encoders:
  - name: profile_encoder
    args:
      data_dim: 3d
      in_channels: 1
      input_shape: [3, 21, 21]
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [1, 3, 3]
      conv1_padding: [0, 1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [1, 2, 2]
      pool_stride: [1, 2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3, 3]
      conv2_padding: [0, 0, 0]
      norm2_num_groups: 4
      dropout: 0.0
  - &signal_encoder
    name: intensity_encoder
    args:
      data_dim: 3d
      in_channels: 1
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [3, 3, 3]
      conv1_padding: [1, 1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [1, 2, 2]
      pool_stride: [1, 2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3, 3]
      conv2_padding: [0, 0, 0]
      norm2_num_groups: 4
      conv3_out_channels: 256
      conv3_kernel_size: [3, 3, 3]
      conv3_padding: [1, 1, 1]
      norm3_num_groups: 8
  - *signal_encoder # k_bg: dedicated variational-background encoder
  - *signal_encoder # r_bg: dedicated variational-background encoder

surrogates:
  qp:
    name: learned_basis_profile
    args:
      input_dim: 64
      latent_dim: 12
      output_dim: 1323
      init_std: 0.5
      prior_scale: 3.0
      smoothness_weight: 0.02
  qbg:
    # variational background head (shape_rate = RepamA; k_min floor is NaN-safe)
    name: gamma
    args:
      reparameterization: shape_rate
      in_features: 64
      eps: 1.0e-06
      k_min: 0.01

loss:
  name: monochromatic_wilson
  args:
    # init_G: 200.0
    lp_correction: true
    init_B: 30.0
    b_min: 0.0
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: 1.0
    bg_concentration: 1.0
    n_bins: 25

optimizer:
  lr: 0.001
  decoder_weight_decay: 1.0e-3

data_loader:
  args:
    data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/scaling_dataset
    batch_size: 2048
    validation_split: 0.2
    num_workers: 8
    include_test: true
    subset_size: null
    resolution_cutoff: null
    min_valid_pixels: 10
    transform: anscombe

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  enable_checkpointing: true
  deterministic: false
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: -1
  monitor: val elbo
  mode: min
