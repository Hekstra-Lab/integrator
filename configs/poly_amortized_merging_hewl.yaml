# Polychromatic (Laue) amortized scaling + merging on HEWL.

# The poly analogue of the monochromatic amortized_merging model. Pixels ->
# scaled + merged per-HKL q(I_h) via the sum-of-potentials conjugate update. The
# ONE poly-specific change is the scale: a wavelength-aware LaueMLPScale folds in
# the incident spectrum G(lambda), so observations at different wavelengths merge
# to the same wavelength-independent F^2_h. The Wilson prior stays resolution-only
# (monochromatic_wilson, pi_weight 0) -- the spectrum lives in the scale.
#
# Prereqs (run once on the data dir):
#   1. scripts/prepare_asu_ids.py <data_dir> "<space_group>" --ref metadata.pt --anomalous
#        -> adds asu_id to metadata.pt and writes hkl_meta.pt (n_hkl). Set n_hkl below.
#   2. (optional, anomalous) scripts/add_friedel_metadata.py for nonanom_id/centric/friedel_plus.
# See docs/polychromatic_merging.md.

integrator:
  name: amortized_merging
  args:
    data_dim: 2d
    d: &d 1
    h: &h 25
    w: &w 25
    lr: 0.001
    encoder_out: &encoder_out 64
    weight_decay: 1.0e-4
    # lr_schedule: cosine_warmup
    # warmup_epochs: 5
    # lr_min: 1.0e-5
    mc_samples: &mc_samples 100

    # Merge: sum-of-potentials conjugate update (multiplicity scales precision).
    n_hkl: 22949          # from hkl_meta.pt (prepare_asu_ids.py output)
    merge_aggregation: sum
    merge_kl_weight: 1.0
    wilson_alpha: 1.0
    merge_attention: false
    merge_overdispersion: false
    # End-of-epoch scatter: model scale*I_h vs DIALS intensity.sum.value (log-CC).
    log_intensity_scatter: true
    log_background_scatter: true

    # Wavelength-aware scale (the poly-specific piece).
    scale_laue_mlp: true
    scale_lambda_min: 0.97    # data wavelength range (Angstrom)
    scale_lambda_max: 1.25
    scale_mlp_hidden: 64
    scale_mlp_layers: 4
    scale_beam_center: [1993.8, 1973.7]   # median spot pos; just centers the MLP input
    scale_r_max: 1600.0                    # ~max spot radius (1518) + headroom
    scale_head_init_std: 0.05
    scale_n_images: null

    # Anomalous-preserving terms (default off; turn on once the bulk merge is
    # validated, then sweep on CCanom). Need the Friedel metadata + a
    # group_by_key: nonanom_id loader.
    consistency_weight: 0.0
    consistency_pool_friedel: false
    centric_anchor_weight: 0.0
    double_wilson_weight: 0.0
    wilson_centric_prior: false

# 5 encoders: profile, k_i, r_i, k_bg, r_bg (no qi surrogate in sum mode).
encoders:
- name: profile_encoder
  args:
    data_dim: 2d
    input_shape: [*h, *w]
    encoder_out: *encoder_out
    conv1_out_channels: 16
    conv2_out_channels: 32
    dropout: 0.1
- &intensity_enc
  name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: *encoder_out
    conv1_out_channels: 16
    conv2_out_channels: 32
    conv3_out_channels: 64
- *intensity_enc
- *intensity_enc
- *intensity_enc

surrogates:
  qp:
    name: learned_basis_profile
    args:
      input_dim: *encoder_out
      latent_dim: 12
      output_dim: 625
      init_std: 0.5
  qbg:
    name: gammaB
    args:
      in_features: *encoder_out
      eps: 1.0e-06
      k_min: 0.1
      positive_constraint: exp

# Resolution-only Wilson prior; pi_weight 0 (the integrator owns the per-HKL
# Wilson KL). The spectrum G(lambda) is NOT here -- it lives in the scale.
loss:
  name: monochromatic_wilson
  args:
    mc_samples: *mc_samples
    eps: 1.0e-06
    b_min: 1.0
    pi_weight: 0.0
    pprf_weight: 1.0
    pbg_weight: 1.0

data_loader:
  name: polychromatic_data
  args:
    data_dir: &data_dir /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_1118/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    shoebox_file_names:
      data_dir: *data_dir
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      reference: metadata.pt
      standardized_counts: null
    D: *d
    H: *h
    W: *w
    anscombe: true
    group_by_asu_id: true
    group_by_key: asu_id
    max_obs_per_hkl: 50

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

logger:
  d: *d
  h: *h
  w: *w

output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_1118/pytorch_data/reflections_.refl
