# sim_qc_resp: sim_geom_both's config_log.yaml; qp {'name': 'quasiconformal_profile'}; profile encoder {'output_activation': 'none'}; integrator {'gate': 'responsibility'}.
# Generated by paper_figures/profile_model/make_configs.py.
mode: polychromatic
integrator:
  name: svae
  args:
    encoder_out: 32
    mc_samples: 50
    predict_keys:
    - refl_ids
    - is_test
    - qi_mean
    - qi_var
    - qbg_mean
    - qbg_var
    - intensity.sum.value
    - intensity.sum.variance
    - background.sum.value
    - background.sum.variance
    - d
    - wavelength
    - H
    - K
    - L
    data_dim: 2d
    d: 1
    h: 41
    w: 41
    gate: responsibility
optimizer:
  lr: 0.001
  weight_decay: 0.0
  lr_schedule: null
surrogates:
  qp:
    name: quasiconformal_profile
    args:
      input_dim: 32
      output_dim: 1681
      profile_shape:
      - 1
      - 41
      - 41
      beam_center:
      - 1987.604697
      - 1965.00825
      lambda_min: 0.99
      lambda_max: 1.21
  qbg:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32
  qi:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32
loss:
  name: polychromatic_wilson
  args:
    degree: 5
    lambda_min: 0.99
    lambda_max: 1.21
    init_G: 1265.8
    init_B: 10.2
    b_min: 1.0
    polarization: false
    lorentz: false
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: 1.0
    bg_concentration: 1.0
    n_bins: 30
    beam_center:
    - 1987.604697
    - 1965.00825
data_loader:
  name: polychromatic_data
  args:
    data_dir: /n/netscratch/hekstra_lab/Lab/laldama/sim/pytorch_41
    batch_size: 512
    validation_split: 0.2
    num_workers: 8
    include_test: true
    subset_size: null
    resolution_cutoff: null
    min_valid_pixels: 10
    transform: anscombe
    shoebox_file_names:
      data_dir: /n/netscratch/hekstra_lab/Lab/laldama/sim/pytorch_41
      counts: counts.npy
      masks: masks.npy
      reference: metadata.npy
      standardized_counts: null
trainer:
  max_epochs: 60
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 10
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
checkpoint:
  save_top_k: -1
encoders:
- name: profile_encoder
  args:
    data_dim: 2d
    encoder_out: 32
    input_shape:
    - 41
    - 41
    output_activation: none
- name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: 32
