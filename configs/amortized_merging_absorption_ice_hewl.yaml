# Amortized merging (the 29-peak config) + two scale-accuracy changes, both
# motivated by the scale/merge diagnostics (regression + parity):
#
#   1. scale_mlp_absorption: feed the MLP scale the crystal-frame spherical-
#      harmonic absorption features (even-l ONLY -> Friedel-symmetric, cannot
#      form the odd-l anomalous-gating band). This gives the flexible MLP the
#      crystal-frame geometry it could not build from lab-frame inputs, which is
#      the absorption surface the scale was missing. Parity showed the true odd
#      content is ~0, so dropping odd-l loses nothing and is safe by construction.
#   2. ice_ring_ranges: drop the contaminated 1.34-1.42 A band at LOAD time so
#      those observations never corrupt scale/merge learning (the post-hoc mask
#      was neutral because the damage was already baked into training).
#
# PREREQUISITE: scripts/extract_crystal_frame_sh.py --lmax 4 -> metadata_sh.pt
# (same file the PhysicalScale configs use). scale_sh_lmax MUST equal the --lmax.
# Train from scratch: the MLP scale input dim changed (4 -> 4 + 14 even-l), so
# the old 29-peak checkpoint's scale weights do not transfer.
integrator:
  name: amortized_merging
  args:
    data_dim: 3d
    d: 3
    h: 21
    w: 21
    lr: 0.001
    merge_aggregation: sum
    merge_attention: true
    merge_overdispersion: false
    init_from_checkpoint: null
    scaling_lr: 0.003
    lr_schedule: step_linear_warmup
    warmup_steps: 1000
    encoder_out: 64
    weight_decay: 0.0
    decoder_weight_decay: 0.0
    qp_smoothness_weight: 0.01
    qp_orthogonality_weight: 0.0
    mc_samples: 100
    predict_keys: [refl_ids, is_test, qi_mean, qi_var, qbg_mean, qbg_var, intensity.prf.value, intensity.prf.variance, background.mean, d, group_label, qp_mean, qp_loc, qp_scale, asu_id]
    n_hkl: 86402
    wilson_alpha: 1.0
    merge_kl_weight: 1.0
    consistency_weight: 0.1
    scale_mlp: true
    scale_mlp_hidden: 128
    scale_mlp_layers: 4
    scale_head_init_std: 0.05
    scale_frame_min: -2.0
    scale_frame_max: 1442.0
    scale_beam_center: [2058.2, 2193.9]
    scale_r_max: 3022
    # --- crystal-frame absorption into the MLP scale (NEW) ---
    scale_sh_lmax: 4                      # MUST equal extract_crystal_frame_sh.py --lmax
    scale_mlp_absorption: true            # even-l crystal-frame SH as MLP inputs
    scale_mlp_absorption_even_only: true  # Friedel-safe: no odd-l anomalous-eating
encoders:
- name: profile_encoder
  args:
    data_dim: 3d
    input_shape: [3, 21, 21]
    encoder_out: 64
    conv1_out_channels: 64
    conv2_out_channels: 128
    dropout: 0.2
- &id001
  name: intensity_encoder
  args:
    data_dim: 3d
    encoder_out: 64
    conv1_out_channels: 64
    conv2_out_channels: 128
    conv3_out_channels: 256
- *id001
- *id001
- *id001
surrogates:
  qp:
    name: learned_basis_profile
    args:
      latent_dim: 12
      input_dim: 64
      output_dim: 1323
      init_std: 0.5
  qbg:
    name: gammaB
    args:
      in_features: 64
      eps: 1.0e-06
      k_min: 0.01
      mu_positive_constraint: softplus
  qi:
    name: gammaB
loss:
  name: monochromatic_wilson
  args:
    lp_correction: false
    mc_samples: 100
    eps: 1.0e-06
    n_bins: 30
    profile_prior_scale: 3.0
    pi_weight: 0.0
    pbg_weight: 1.0
    pprf_weight: 1.0
data_loader:
  name: rotation_data
  args:
    data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    group_by_asu_id: true
    max_obs_per_hkl: null
    # Drop the contaminated ice-ring band at load time (NEW). Add more
    # [d_low, d_high] pairs here if other bands show up.
    ice_ring_ranges: [[1.34, 1.42]]
    shoebox_file_names:
      data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      # Augmented metadata WITH absorption_sh (from extract_crystal_frame_sh.py).
      reference: metadata_sh.pt
      standardized_counts: null
    D: 3
    H: 21
    W: 21
    anscombe: true
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
checkpoint:
  every_n_epochs: 5
  save_top_k: -1
logger:
  d: 3
  h: 21
  w: 21
output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data/reflections_.refl
  dials_merge_html: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/merged_reference.html
  phenix_refine_log: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/refine_001.log
  anomalous_peaks: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/reference_peaks.csv
  phenix_eff: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/phenix.eff
  pdb: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/9b7c.pdb
  expt_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/dials_2026-05-14/integrated.expt
