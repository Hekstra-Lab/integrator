# Control for dhfr_sim_nanobragg.yaml: same data, integrator, loss and training;
# the profile is the learned-geometry surrogate (settings of
# configs/ablate/q2_profile_geomboth.yaml) instead of nanoBragg.
mode: polychromatic
integrator:
  name: hierarchical_3enc
  args:
    encoder_out: 32
    mc_samples: 50
    predict_keys: default
    d: 1
    h: 21
    w: 21
    data_dim: 2d
optimizer:
  lr: 0.001
  weight_decay: 0.0
  lr_schedule: null
  decoder_weight_decay: 0.001
surrogates:
  qp:
    name: geometric_basis_profile
    args:
      latent_dim: 12
      init_std: 0.5
      prior_scale: 3.0
      smoothness_weight: 0.001
      local_shift: true
      steer: true
  qbg:
    name: gamma
    args:
      reparameterization: shape_rate
      eps: 1.0e-06
      k_min: 0.01
      positive_constraint: exp
  qi:
    name: gamma
    args:
      reparameterization: shape_rate
      eps: 1.0e-06
      k_min: 0.01
      positive_constraint: exp
loss:
  name: polychromatic_wilson
  args:
    degree: 5
    lambda_min: 1.02
    lambda_max: 1.18
    init_G: 5000.0
    init_B: 30.0
    b_min: 1.0
    polarization: false
    lorentz: false
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: 1.0
    bg_concentration: 1.0
    n_bins: 30
data_loader:
  name: polychromatic_data
  args:
    data_dir: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/dhfr_sim/nanobragg_prior/full180
    batch_size: 256
    validation_split: 0.2
    num_workers: 8
    include_test: true
    subset_size: null
    resolution_cutoff: null
    min_valid_pixels: 10
    transform: anscombe
trainer:
  max_epochs: 20
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 10
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
checkpoint:
  save_top_k: -1
