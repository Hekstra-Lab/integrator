# HEWL/1118 poly profile screen — base arm (latent 16, profile kernel 3).
# 5-enc minimal + stabilize_scale (validated; no EM refit) + qi softplus.
# Explicit encoders so the profile conv kernel is tunable per arm.
mode: polychromatic

integrator:
  name: hierarchical
  args:
    data_dim: 2d
    d: 1
    h: 25
    w: 25
    encoder_out: 64
    mc_samples: 50
    predict_keys: default

optimizer:
  lr: 0.001
  weight_decay: 1.0e-4
  lr_schedule: cosine_warmup
  warmup_epochs: 5
  lr_min: 1.0e-5

encoders:
  - name: profile_encoder
    args:
      data_dim: 2d
      in_channels: 1
      input_shape: [25, 25]
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [3, 3]     # SCREEN VARIABLE (padding = (k-1)/2)
      conv1_padding: [1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [2, 2]
      pool_stride: [2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3]
      conv2_padding: [0, 0]
      norm2_num_groups: 4
      dropout: 0.0
  - &intensity_encoder
    name: intensity_encoder
    args:
      data_dim: 2d
      in_channels: 1
      encoder_out: 64
      conv1_out_channels: 64
      conv1_kernel_size: [3, 3]
      conv1_padding: [1, 1]
      norm1_num_groups: 4
      pool_kernel_size: [2, 2]
      pool_stride: [2, 2]
      conv2_out_channels: 128
      conv2_kernel_size: [3, 3]
      conv2_padding: [0, 0]
      norm2_num_groups: 4
      conv3_out_channels: 256
      conv3_kernel_size: [3, 3]
      conv3_padding: [1, 1]
      norm3_num_groups: 8
  - *intensity_encoder
  - *intensity_encoder
  - *intensity_encoder

surrogates:
  qp:
    name: learned_basis_profile
    args:
      input_dim: 64
      latent_dim: 8            # SCREEN VARIABLE
      output_dim: 625
      init_std: 0.5
      prior_scale: 3.0
  qbg:
    name: gamma
    args:
      reparameterization: mean_fano
      in_features: 64
      eps: 1.0e-6
      k_min: 0.1
      positive_constraint: softplus
  qi:
    name: gamma
    args:
      reparameterization: mean_fano
      in_features: 64
      eps: 1.0e-6
      k_min: 0.1
      positive_constraint: softplus

loss:
  name: polychromatic_wilson
  args:
    degree: 40
    lambda_min: 0.97
    lambda_max: 1.25
    init_G: 5000.0              # poly ChebyshevSpectrum needs a numeric start (~7000 counts/shoebox);
                               #   init_scale_from_counts still refines it under stabilize_scale
    init_B: 30.0
    b_min: 0.0
    stabilize_scale: true       # log-space G (no dead-gradient collapse)
    init_scale_from_counts: true
    refit_prior_every_n_epochs: 0   # EM refit OFF for the profile screen
    polarization: false
    lorentz: false
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: 1.0
    bg_concentration: 1.0
    n_bins: 1

data_loader:
  name: polychromatic_data
  args:
    data_dir: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/1118_hewl3/shoeboxes
    batch_size: 512
    validation_split: 0.2
    num_workers: 8
    include_test: true
    subset_size: null
    resolution_cutoff: null
    min_valid_pixels: 10
    transform: anscombe

trainer:
  max_epochs: 20                # screen budget; confirm runs use 40
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 2
  log_every_n_steps: 10
  enable_checkpointing: true
  deterministic: false
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  save_top_k: -1
  monitor: val elbo
  mode: min

output:
  refl_file: /n/netscratch/hekstra_lab/Lab/laldama/laue_runs/1118_hewl3/predictions.refl
