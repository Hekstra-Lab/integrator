# STRICT prior SBC: every prior parameter is held at the value the data were drawn from (init_from_checkpoint = the generating checkpoint,
# mos010_pc_default_svae_kmixv2_post epoch 59, then optimizer.frozen_params: the profile prior theta0, f(m) = shape_head, sigma_eta, and the
# Wilson G(lambda) and B in loss.*; the background prior is the same fixed per-bin Gamma). Only the inference networks train on the simulated
# data. SBC is valid only when the inference uses the generating prior; the earlier SBC-trained runs learned the profile prior.
# Integrator hierarchical (five encoders): its intensity and background encoders and q(I), q(b) heads have no counterpart in the
# checkpoint and start fresh. Otherwise identical to sbc_prior_b1_kmixv2_post_hier.yaml, whose header follows.
# Prior SBC of B1 as fully amortized VI: integrator hierarchical (five encoders: profile, k_I, r_I, k_b, r_b), q(I) and q(b) amortized Gammas
# (surrogates.qi, surrogates.qbg) each from its own pair of intensity encoders, no gate and no conjugate update; same profile surrogate, loss,
# priors and data, so SBC compares the inference alone. `gate` is dropped (the hierarchical integrators have none); the four intensity
# encoders repeat B1's one. Otherwise identical to sbc_prior_b1_kmixv2_post.yaml, whose header follows.
# Prior SBC of B1: B1 trained on shoeboxes drawn from B1's own generative model (scripts/sim_truth/sbc_simulate.py,
# seed 0, from mos010_pc_default_svae_kmixv2_post epoch 59 on the pc_default_25 geometry). The background prior is the
# per-resolution-bin Gamma the simulation drew b from (the 30 bins of group_labels_30.npy; bin means 6.7-31.0 photons/px),
# written here as bg_concentration / bg_rate, so the inference model is the generating model.
# Score with scripts/sim_truth/sbc_ranks.py --data <the same directory>.
# Otherwise identical to mos010_default_kmixv2_post.yaml, whose header follows.
# B1: P1 base with a per-reflection shape posterior (11 shape numbers + tilt offset), learned sigma bounded at 1.0.
# split_seed 0 fixes the train/validation split so validation losses compare across these arms
# (the T0 runs drew it unseeded). No setting comes from a true profile.
# Otherwise identical to mos010_default_kmix_base.yaml, whose header follows.
# T0: mos010_default_streak.yaml with qp = streak_kmix_profile, n_components 3, residual: none, init_grid_scale 1.0.
# K aligned Gaussian components along the analytic azimuth; widths are softplus excess over the pixel under one cap
# (window half-side); starting widths on a geometric grid from the window (along 1 px to side/4, across 0.3 px to side/8)
# times init_grid_scale. No setting comes from a true profile. The profile encoder is cut out (residual: none).
# Otherwise identical to mos010_default_streak.yaml, whose header follows.
# N1: mos010_default.yaml with qp = streak_base_profile at its defaults: closed-form streak base
# (analytic azimuth, tanh-bounded extents from radius, centre from xyzcal) plus the detector-frame
# learned-basis residual W h gated by the base's profile-fit signal-to-noise (z0 = 12).
# init_extent from bright-spot moments of this dataset (4.2, 1.0 px).
# mos010_default: svae, gate: responsibility, learned_basis_profile, 25x25, on the datsimx mos010 run,
# the DEFAULT laue.predict set (162,117 reflections), nanoBragg-noise photon-counting (gain 1, readout 0, calib 0), cut at laue.integrate's own reflections and centroids (docs/sim_truth.md).
# From configs/poly/hewl1118_svae_gate_responsibility.yaml; differs in data_dir and the dataset's own
# beam_center (dataset.yaml beam_center_px), lambda_min/max (spectrum 1.02-1.18 A +- 0.01) and Wilson
# init_G/init_B (this dataset's own, scripts/poly/estimate_wilson_init.py, photons), plus
# profile encoder output_activation: none (a final ReLU made x = 0 absorbing: svae_profile_encoder_dead)
# and max_epochs 60 (the DHFR sim arms). intensity_variance stays at its default; score both estimators,
# predict config from scripts/poly/rb_predict_config.py KEYS=both.
mode: polychromatic
integrator:
  name: hierarchical
  args:
    init_from_checkpoint: /n/netscratch/hekstra_lab/Lab/laldama/sim_runs/mos010_pc_default_svae_kmixv2_post/files/checkpoints/epoch=0059.ckpt
    encoder_out: 32
    mc_samples: 50
    predict_keys:
    - refl_ids
    - is_test
    - qi_mean
    - qi_var
    - qbg_mean
    - qbg_var
    - intensity.sum.value
    - intensity.sum.variance
    - background.sum.value
    - background.sum.variance
    - d
    - wavelength
    - H
    - K
    - L
    data_dim: 2d
    d: 1
    h: 25
    w: 25
optimizer:
  lr: 0.001
  weight_decay: 0.0
  lr_schedule: null
  frozen_params:
  - surrogates.qp.theta0
  - surrogates.qp.eta_sd_raw
  - surrogates.qp.shape_head
  - loss.
surrogates:
  qp:
    name: streak_kmix_v2_profile
    args:
      latent_dim: 12
      init_std: 0.5
      prior_scale: 3.0
      output_dim: 625
      input_dim: 32
      beam_center:
      - 2074.5
      - 2181.5
      lambda_min: 1.01
      lambda_max: 1.19
      profile_shape:
      - 1
      - 25
      - 25
      n_components: 3
      init_grid_scale: 1.0
      geom_hidden: 128
      shape_posterior: amortized
      residual: none
  qbg:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32
  qi:
    name: gamma
    args:
      reparameterization: mean_fano
      eps: 1.0e-06
      k_min: 0.01
      in_features: 32
loss:
  name: polychromatic_wilson
  args:
    degree: 5
    lambda_min: 1.01
    lambda_max: 1.19
    init_G: 1910.4
    init_B: 19.0
    b_min: 1.0
    polarization: false
    lorentz: false
    intensity_kl_weight: 1.0
    background_kl_weight: 1.0
    profile_kl_weight: 1.0
    bg_rate: [4.93806, 4.76507, 4.66467, 4.40946, 4.40791, 4.64254, 5.0303, 5.45313, 5.81834, 5.71642, 6.51682, 7.28894, 7.31464, 7.77676, 7.33401, 6.32224, 5.4013, 4.68032, 3.9462, 3.41562, 3.48016, 4.35211, 7.61792, 9.12907, 4.79585, 2.45055, 1.63335, 1.69189, 3.41442, 2.97159]
    bg_concentration: [42.4719, 48.0769, 53.1462, 55.607, 60.7491, 69.1738, 79.5408, 90.0923, 100.084, 101.208, 118.625, 136.167, 139.25, 151.528, 147.059, 132.309, 118.762, 109.496, 98.0146, 90.7485, 98.9376, 130.355, 235.409, 283.16, 142.383, 65.3788, 36.1629, 27.9099, 39.0397, 19.8663]
    n_bins: 30
    beam_center:
    - 2074.5
    - 2181.5
data_loader:
  name: polychromatic_data
  args:
    data_dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/sbc/prior_b1_seed0
    batch_size: 512
    validation_split: 0.2
    split_seed: 0
    num_workers: 8
    include_test: true
    subset_size: null
    resolution_cutoff: null
    min_valid_pixels: 10
    transform: anscombe
    shoebox_file_names:
      data_dir: /n/netscratch/hekstra_lab/Lab/laldama/sims/sbc/prior_b1_seed0
      counts: counts.npy
      masks: masks.npy
      reference: metadata.npy
      standardized_counts: null
trainer:
  max_epochs: 60
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 10
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
checkpoint:
  save_top_k: -1
encoders:
- name: profile_encoder
  args:
    data_dim: 2d
    encoder_out: 32
    input_shape:
    - 25
    - 25
    output_activation: none
- name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: 32
- name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: 32
- name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: 32
- name: intensity_encoder
  args:
    data_dim: 2d
    encoder_out: 32
