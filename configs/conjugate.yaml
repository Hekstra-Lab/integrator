integrator:
  name: conjugate
  args:
    data_dim: 3d
    d: &d 3
    h: &h 21
    w: &w 21
    lr: 0.001
    encoder_out: &encoder_out 64
    weight_decay: 0.0
    decoder_weight_decay: 0.0
    qp_smoothness_weight: 1.0e-3      # smoothness penalty on the qp basis W
    qp_orthogonality_weight: 0.0
    mc_samples: &mc_samples 100       # MC samples for the reconstruction ELBO

    # --- Conjugate intensity (the model's core) ---------------------------
    wilson_alpha: 1.0                 # alpha_W = 1 (acentric / exponential Wilson)
    n_em_iters: 40                    # max inner CAVI iters (early-stops at em_tol)
    em_tol: 1.0e-3                    # relative-change tolerance for convergence
    sample_I_h: true                  # MC-sample I from q(I_i) for the NLL term

    # --- Calibrated intensity posterior at export (Fix A + Fix B) ---------
    # The training-time mean-field Gamma has ~2x-too-narrow variance; these
    # control the exact-quadrature + nuisance-propagation posterior emitted via
    # the qi_exact_* predict keys (see docs S10.4). Only run if requested.
    exact_posterior_n_nuisance: 16    # MC nuisance samples (<=1 = Fix A only)
    exact_posterior_n_grid: 1024      # quadrature grid points (<0.5% var error)

    # --- No scale: pure integration, rate = prof*I + bg -------------------
    # I is the raw integrated intensity (no LP, no learned scale); scaling and
    # merging are left to downstream (DIALS / aimless / Phenix). Set
    # scale_none: false (and scale_mlp/scale_spatial) to fold scaling into the
    # model instead.
    scale_none: true

    predict_keys: [refl_ids, is_test, qi_mean, qi_var, qi_exact_mean, qi_exact_var, qi_exact_std, qbg_mean, qbg_var, intensity.prf.value, intensity.prf.variance, background.mean, d, group_label, qp_mean, qp_loc, qp_scale, asu_id]

# Three encoders only: profile + (k_bg, r_bg). NO intensity encoder.
encoders:
- name: profile_encoder
  args:
    data_dim: 3d
    input_shape: [*d, *h, *w]
    encoder_out: *encoder_out
    conv1_out_channels: 64
    conv2_out_channels: 128
    dropout: 0.2
- &bg_enc
  name: intensity_encoder
  args:
    data_dim: 3d
    encoder_out: *encoder_out
    conv1_out_channels: 64
    conv2_out_channels: 128
    conv3_out_channels: 256
- *bg_enc

# Two surrogates: profile + background. NO qi (I_i is derived in closed form).
surrogates:
  qp:
    name: learned_basis_profile
    args:
      warmstart_basis_path: hermite_profile_basis.pt
      hermite_max_order: 4
      hermite_basis_sigma: 3.0
      hermite_sigma_z: 1.0
      hermite_max_order_z: 1
      input_dim: *encoder_out
      output_dim: 1323               # = d*h*w = 3*21*21
      init_std: 0.5
  qbg:
    # gammaB (mean, Fano) for the background rate. gammaA is a more NaN-robust
    # alternative if the background surrogate ever destabilizes.
    name: gammaB
    args:
      in_features: *encoder_out
      eps: 1.0e-06
      k_min: 0.01
      mu_positive_constraint: softplus

loss:
  name: monochromatic_wilson
  args:
    lp_correction: false
    mc_samples: *mc_samples
    eps: 1.0e-06
    n_bins: 30
    profile_prior_scale: 3.0
    # REQUIRED == 1.0: the loss's KL(qi || Wilson) is then exactly the per-obs
    # closed-form Gamma-Gamma KL of the conjugate posterior (no overcounting).
    pi_weight: 1.0
    pbg_weight: 1.0
    pprf_weight: 1.0

# --- Dataset (repoint data_dir / output paths for other datasets) ------------
data_loader:
  name: rotation_data
  args:
    data_dir: &data_dir /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    group_by_asu_id: false           # each obs is independent in the per-obs model
    shoebox_file_names:
      data_dir: *data_dir
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      reference: metadata.pt
      standardized_counts: null
    D: *d
    H: *h
    W: *w
    anscombe: true                   # encoder input only; conjugacy uses raw counts

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'                    # fp32 (bf16 is slower on this cluster)
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

logger:
  d: *d
  h: *h
  w: *w

output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data/reflections_.refl
  dials_merge_html: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/merged_reference.html
  phenix_refine_log: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/refine_001.log
  anomalous_peaks: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/reference_peaks.csv
  phenix_eff: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/phenix.eff
  pdb: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/9b7c.pdb
  expt_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/dials_2026-05-14/integrated.expt
