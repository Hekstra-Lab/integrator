# Best amortized/scaling config (29-peak) + the three anomalous-preserving
# terms, all aimed at stopping the scale/merge from eating the Bijvoet signal:
#
#   (3) consistency_pool_friedel: the data-only scaling-consistency target is
#       computed over the Friedel-POOLED group (nonanom_id), so the per-obs scale
#       is identified against the +/- pooled mean and cannot lower its residual
#       by splitting the mates. NOTE: consistency_weight must be > 0 (it was off
#       in the 29-peak config) for this to do anything.
#   (1) centric_anchor_weight: centrics have I(+)==I(-) by symmetry, so any
#       Bijvoet difference the scale makes on them is pure scale error. Penalize
#       the fractional +/- difference of the sign-split WLS intensity on
#       centrics (scale-only gradient). Watch the logged `train centric_anchor`
#       (RMS fake-anomalous-on-centrics) and raise the weight until it drops.
#   (4) double_wilson_weight: couple paired mates' merged means with a zero-mean
#       Normal prior on their log-ratio (the conditional factor of the
#       double-Wilson prior). Shrinks noise-driven anomalous toward zero; the
#       likelihood keeps the real signal. Watch `train double_wilson` (the
#       anomalous spread) and CCanom/peak count; too high flattens real signal.
#
# PREREQUISITES (offline, on the cluster, in row order with the SH file):
#   scripts/extract_crystal_frame_sh.py ... --lmax 4 -> metadata_sh.pt
#   scripts/add_friedel_metadata.py <data_dir> "<space_group>" \
#       --ref metadata_sh.pt --out metadata_sh_friedel.pt
# The loader groups batches by nonanom_id so each reflection's I(+) and I(-)
# observations share a batch (the three terms need both mates present).
# Train from scratch (the scale input dim is unchanged from the 29-peak config,
# but the merge now sees the coupling, so reuse of that checkpoint is optional).
integrator:
  name: amortized_merging
  args:
    data_dim: 3d
    d: 3
    h: 21
    w: 21
    lr: 0.001
    merge_aggregation: sum
    merge_attention: false
    merge_overdispersion: false
    init_from_checkpoint: null
    scaling_lr: 0.005
    #lr_schedule: step_linear_warmup
    warmup_steps: 1000
    encoder_out: 64
    weight_decay: 0.0
    decoder_weight_decay: 0.0
    qp_smoothness_weight: 0.02
    qp_orthogonality_weight: 0.0
    mc_samples: 100
    predict_keys: [refl_ids, is_test, qi_mean, qi_var, qbg_mean, qbg_var, intensity.prf.value, intensity.prf.variance, background.mean, d, group_label, qp_mean, qp_loc, qp_scale, asu_id]
    n_hkl: 86402
    wilson_alpha: 1.0
    merge_kl_weight: 1.0
    # --- (3) Friedel-pooled scaling consistency ---
    consistency_weight: 0.5          # was off (0.0) in the 29-peak config
    consistency_pool_friedel: true
    # --- (1) centric anchoring ---
    centric_anchor_weight: 1.0       # tune up watching `train centric_anchor`
    # --- (4) double-Wilson coupling ---
    double_wilson_weight: 1.0        # tune watching `train double_wilson` + CCanom
    # --- centric/acentric Wilson prior: centrics get Gamma(1/2) (chi^2_1) ---
    wilson_centric_prior: true
    scale_mlp: true
    scale_mlp_hidden: 128
    scale_mlp_layers: 4
    scale_head_init_std: 0.05
    scale_frame_min: -2.0
    scale_frame_max: 1442.0
    scale_beam_center: [2058.2, 2193.9]
    scale_r_max: 3022
    # --- crystal-frame absorption into the MLP scale (from the 29-peak config) ---
    scale_sh_lmax: 4                      # MUST equal extract_crystal_frame_sh.py --lmax
    scale_mlp_absorption: true            # even-l crystal-frame SH as MLP inputs
    scale_mlp_absorption_even_only: true  # Friedel-safe: no odd-l anomalous-eating
encoders:
- name: profile_encoder
  args:
    data_dim: 3d
    input_shape: [3, 21, 21]
    encoder_out: 64
    conv1_out_channels: 64
    conv2_out_channels: 128
    dropout: 0.2
- &id001
  name: intensity_encoder
  args:
    data_dim: 3d
    encoder_out: 64
    conv1_out_channels: 64
    conv2_out_channels: 128
    conv3_out_channels: 256
- *id001
- *id001
- *id001
surrogates:
  qp:
    name: learned_basis_profile
    args:
      latent_dim: 12
      input_dim: 64
      output_dim: 1323
      init_std: 0.5
  qbg:
    name: gammaB
    args:
      in_features: 64
      eps: 1.0e-06
      k_min: 0.01
      mu_positive_constraint: softplus
  qi:
    name: gammaB

loss:
  name: monochromatic_wilson
  args:
    lp_correction: false
    mc_samples: 100
    eps: 1.0e-06
    n_bins: 30
    profile_prior_scale: 3.0
    pi_weight: 0.0
    pbg_weight: 1.0
    pprf_weight: 1.0

data_loader:
  name: rotation_data
  args:
    data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    group_by_asu_id: true
    # Group batches by the Friedel-POOLED id so I(+) and I(-) of a reflection
    # share a batch (the centric-anchor / double-Wilson / pooled-consistency
    # terms need both mates present). Still yields complete asu_id groups.
    group_by_key: nonanom_id
    max_obs_per_hkl: null
    # Drop the contaminated ice-ring band at load time. (This now actually takes
    # effect: the factory previously dropped ice_ring_ranges before passing it
    # to the data module.)
    ice_ring_ranges: [[1.34, 1.42]]
    shoebox_file_names:
      data_dir: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      # Augmented metadata WITH absorption_sh (extract_crystal_frame_sh.py) AND
      # nonanom_id/centric/friedel_plus (add_friedel_metadata.py).
      reference: metadata_sh_friedel.pt
      standardized_counts: null
    D: 3
    H: 21
    W: 21
    anscombe: true
trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
checkpoint:
  every_n_epochs: 5
  save_top_k: -1
logger:
  d: 3
  h: 21
  w: 21
output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data/reflections_.refl
  dials_merge_html: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/merged_reference.html
  phenix_refine_log: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/refine_001.log
  anomalous_peaks: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/reference_peaks.csv
  phenix_eff: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/phenix.eff
  pdb: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/9b7c.pdb
  expt_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/dials_2026-05-14/integrated.expt
