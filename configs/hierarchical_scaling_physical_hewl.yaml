# Hierarchical scaling with the DIALS-style PhysicalScale (the anomalous fix).
#
# Identical integration to hierarchical_scaling_hewl.yaml (warm-start + freeze
# from the trained hierarchical "36" checkpoint), but the unconstrained MLP scale
# is replaced by PhysicalScale:
#
#     s_i = scale(frame) x decay(frame, d) x absorption(Y_lm(crystal-frame dir))
#
# The MLP captured the bulk scale (merged means corr 0.98) but learned NOISE in
# the fine within-image band -- it never saw the crystal-frame diffracted-beam
# direction that absorption depends on, and was too flexible to be pinned there
# by the consistency signal. That fine band gates the anomalous signal, so the
# MLP's merged anomalous differences came out uncorrelated with DIALS (corr 0.14,
# 6 peaks). PhysicalScale fixes both: it gets the crystal-frame direction as a
# precomputed SH basis, and a smooth low-dim form that cannot interpolate noise.
#
# PREREQUISITE: run scripts/extract_crystal_frame_sh.py with the SAME --lmax as
# scale_sh_lmax below to produce metadata_sh.pt, then point the data loader's
# reference at it (done below). Pair with group_by_asu_id: true.
integrator:
  name: hierarchical_scaling
  args:
    data_dim: 3d
    d: &d 3
    h: &h 21
    w: &w 21
    lr: 0.001
    encoder_out: &encoder_out 32
    weight_decay: 0.0
    decoder_weight_decay: 0.0
    qp_smoothness_weight: 1.0e-2
    qp_orthogonality_weight: 0.0
    mc_samples: &mc_samples 100
    predict_keys: [refl_ids, is_test, qi_mean, qi_var, qbg_mean, qbg_var, intensity.prf.value, intensity.prf.variance, background.mean, d, group_label, qp_mean, qp_loc, qp_scale, asu_id]

    # --- warm-start + freeze (REQUIRED) ---
    # Point at the trained hierarchical checkpoint that scored 36. With
    # freeze_integration the encoders + qp/qbg/qi are loaded and frozen; only
    # PhysicalScale (scale/decay/absorption coeffs) + the overdispersion train.
    init_from_checkpoint: null   # <-- set to .../checkpoints/epoch=*.ckpt
    freeze_integration: true

    # --- merge / scale head ---
    n_hkl: 86402
    wilson_alpha: 1.0
    merge_kl_weight: 0.0
    consistency_weight: 1.0      # the Gaussian-NLL scaling-consistency objective
    merge_overdispersion: true   # intensity-dependent error model (SdAdd-style)
    scaling_lr: 3.0e-3           # decoupled LR for the scale coefficients

    # PhysicalScale (DIALS-style). scale_sh_lmax MUST equal the extractor --lmax.
    scale_physical: true
    scale_mlp: false
    scale_sh_lmax: 4             # 24 harmonics (DIALS "low"); 6 -> 48 ("medium")
    scale_degree: 6             # rotation scale(frame) Chebyshev order
    scale_degree_decay: 2       # B-factor(frame) order (resolution falloff)
    scale_absorption_init_std: 0.0   # absorption starts flat; data identifies it
    # L2 restraint (l(l+1)-weighted) on the absorption + decay coeffs. This is
    # the term that opposes the consistency loss absorbing the Bijvoet signal
    # and stops the surface running away (cf. Beer-Lambert -> f_A~0 at edges).
    # Sweep this: watch abs_c_rms / scale_std (run-away) and the Bijvoet
    # diagnostic / compare_scale_to_dials r_detrended (over/under-correction).
    scale_absorption_restraint: 1.0e-2
    scale_frame_min: -2.0
    scale_frame_max: 1442.0

# Five encoders: profile + (k_i, r_i, k_bg, r_bg) -- IDENTICAL to the hierarchical
# config so the warm-start matches (conv 16/32 profile, 16/32/64 intensity).
encoders:
- name: profile_encoder
  args:
    data_dim: 3d
    input_shape: [*d, *h, *w]
    encoder_out: *encoder_out
    conv1_out_channels: 16
    conv2_out_channels: 32
- &int_enc
  name: intensity_encoder
  args:
    data_dim: 3d
    encoder_out: *encoder_out
    conv1_out_channels: 16
    conv2_out_channels: 32
    conv3_out_channels: 64
- *int_enc
- *int_enc
- *int_enc

# Surrogates IDENTICAL to the hierarchical config (so qp/qbg/qi warm-start).
surrogates:
  qp:
    name: learned_basis_profile
    args:
      input_dim: *encoder_out
      latent_dim: 14
      output_dim: 1323
      init_std: 0.5
  qbg:
    name: gammaB
    args:
      in_features: *encoder_out
      eps: 1.0e-06
      k_min: 0.01
      mu_positive_constraint: exp
  qi:
    name: gammaB
    args:
      in_features: *encoder_out
      eps: 1.0e-06
      k_min: 0.01
      mu_positive_constraint: exp

loss:
  name: monochromatic_wilson
  args:
    lp_correction: false
    mc_samples: *mc_samples
    eps: 1.0e-06
    n_bins: 30
    profile_prior_scale: 3.0
    # pi_weight=0: the per-obs group-prior KL is skipped; the scaling-consistency
    # coupling is the intensity prior now. (The hierarchical config used 1.0.)
    pi_weight: 0.0
    pbg_weight: 1.0
    pprf_weight: 1.0

data_loader:
  name: rotation_data
  args:
    data_dir: &data_dir /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data
    batch_size: 2048
    val_split: 0.2
    test_split: 0.0
    num_workers: 8
    include_test: true
    subset_size: null
    cutoff: null
    # Required: the per-HKL merge needs complete HKL groups per batch.
    group_by_asu_id: true
    max_obs_per_hkl: null
    shoebox_file_names:
      data_dir: *data_dir
      counts: counts.npy
      masks: masks.npy
      stats: anscombe_stats.pt
      # Augmented metadata WITH absorption_sh (from extract_crystal_frame_sh.py).
      reference: metadata_sh.pt
      standardized_counts: null
    D: *d
    H: *h
    W: *w
    anscombe: true

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  logger: true
  precision: '32'
  check_val_every_n_epoch: 5
  log_every_n_steps: 1
  deterministic: false
  enable_checkpointing: true
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

checkpoint:
  every_n_epochs: 5
  save_top_k: -1

logger:
  d: *d
  h: *h
  w: *w

output:
  refl_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/pytorch_data/reflections_.refl
  dials_merge_html: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/merged_reference.html
  phenix_refine_log: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/refine_001.log
  anomalous_peaks: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/reference_peaks.csv
  phenix_eff: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/phenix.eff
  pdb: /n/holylabs/LABS/hekstra_lab/Users/laldama/integrato_refac/integrator/reference_data/9b7c.pdb
  expt_file: /n/lab_storage/hekstra_lab/people/aldama/integrator_data/hewl_9b7c/reference_data/integrated.expt
